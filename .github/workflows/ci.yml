name: Go validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vet
        run: sh scripts/go.sh vet ./...
      - name: Local storage reset
        run: make test-reset
      - name: Unit, IPC lifecycle, race and NIP-44 vectors
        run: sh scripts/go.sh test -race -count=1 -p=1 ./... fiatjaf.com/nostr/nip44
      - name: Formatting
        run: |
          sh scripts/go.sh fmt ./...
          git diff --exit-code
