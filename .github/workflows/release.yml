name: macOS packages
on:
  pull_request:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: macos-packages-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: Release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then RELEASE_TAG=0.2.0; fi
          BLAKESWAP_VERSION="$RELEASE_TAG" python3 scripts/package-version.py
          echo "BLAKESWAP_VERSION=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "BLAKESWAP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Packaging and launcher tests
        run: make test-packaging test-local-nodes
      - name: Build and verify DMG
        run: sh scripts/build-dmg.sh
      - name: Native tests
        env:
          BLAKESWAP_TEST_HELPER: ${{ github.workspace }}/bin/Blakeswap.app/Contents/Resources/blakeswap
        run: swift test --package-path macos --scratch-path .cache/swift-build --cache-path .cache/swift-cache -c release
      - name: Checksums
        run: |
          cd bin
          for dmg in *.dmg; do shasum -a 256 "$dmg" > "$dmg.sha256"; done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: |
            bin/*.dmg
            bin/*.dmg.sha256
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: macos-*
          path: packages
          merge-multiple: true
      - name: Attach both architectures to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          cd packages
          version="${RELEASE_TAG#v}"
          for arch in arm64 x86_64; do
            test -f "Blakeswap-$version-$arch.dmg"
            sha256sum -c "Blakeswap-$version-$arch.dmg.sha256"
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            prerelease=()
            case "$version" in *-*) prerelease=(--prerelease);; esac
            gh release create "$RELEASE_TAG" --verify-tag --title "Blakeswap $version" \
              --notes 'macOS 15 or later. Choose arm64 for Apple silicon or x86_64 for Intel. These builds are ad-hoc signed and are not notarized; Gatekeeper may block opening them.' \
              "${prerelease[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./*.dmg ./*.sha256 --clobber
