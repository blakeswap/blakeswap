syntax = "proto3";
package blakeswap.v1;
option go_package = "github.com/blakeswap/blakeswap/api/gen/blakeswap/v1;blakeswapv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
 info: { title: "Blakeswap daemon API" version: "1.0" description: "Local wallet API. All amounts are integer satoshis. Protobuf JSON represents int64 as decimal strings. Bearer credentials are read from a private runtime file. HTTP binds only to loopback; gRPC binds to a private Unix socket." }
 schemes: HTTP
 consumes: "application/json"
 produces: "application/json"
 security_definitions: { security: { key: "Bearer" value: { type: TYPE_API_KEY in: IN_HEADER name: "Authorization" description: "Bearer <runtime token>" } } }
 security: { security_requirement: { key: "Bearer" value: {} } }
};

service DaemonService {
 rpc ListActivity(ActivityQuery) returns (ActivityPage) { option (google.api.http) = { post: "/v1/activity/query" body: "*" }; }
 rpc ExportActivity(ActivityQuery) returns (ActivityExport) { option (google.api.http) = { post: "/v1/activity/export" body: "*" }; }
 rpc GetStatus(google.protobuf.Empty) returns (Status) { option (google.api.http) = { get: "/v1/status" }; }
 rpc RefreshStatus(RefreshStatusRequest) returns (Status) { option (google.api.http) = { post: "/v1/status/refresh" body: "*" }; }
 rpc ResolveWatchtower(ResolveWatchtowerRequest) returns (google.protobuf.Empty) { option (google.api.http) = { post: "/v1/watchtowers/resolve" body: "*" }; }
 rpc SetPaused(SetPausedRequest) returns (Status) { option (google.api.http) = { put: "/v1/pause" body: "*" }; }
 rpc CreateOffer(CreateOfferRequest) returns (Offer) { option (google.api.http) = { post: "/v1/offers" body: "*" }; }
 rpc CancelOffer(CancelOfferRequest) returns (Offer) { option (google.api.http) = { delete: "/v1/offers/{id}" }; }
 rpc TakeOffer(TakeOfferRequest) returns (TakeOfferResponse) { option (google.api.http) = { post: "/v1/swaps" body: "*" }; }
 rpc Mine(MineRequest) returns (google.protobuf.Empty) { option (google.api.http) = { post: "/v1/regtest/mine" body: "*" }; }
 rpc Faucet(FaucetRequest) returns (FaucetResponse) { option (google.api.http) = { post: "/v1/regtest/faucet" body: "*" }; }
 rpc GetRecovery(google.protobuf.Empty) returns (Recovery) { option (google.api.http) = { post: "/v1/wallet/recovery" body: "*" }; }
 rpc PreflightFunds(FundsPreflightRequest) returns (FundsPreflight) { option (google.api.http) = { post: "/v1/wallet/preflight" body: "*" }; }
 rpc QuoteTrade(TradeQuoteRequest) returns (TradeQuote) { option (google.api.http) = { post: "/v1/trades/quote" body: "*" }; }
 rpc ConfirmTrade(ConfirmTradeRequest) returns (ConfirmTradeResult) { option (google.api.http) = { post: "/v1/trades/confirm" body: "*" }; }
 rpc QuoteFee(FeeQuoteRequest) returns (FeeQuote) { option (google.api.http) = { post: "/v1/fees/quote" body: "*" }; }
 rpc BumpTransaction(BumpRequest) returns (BumpResult) { option (google.api.http) = { post: "/v1/transactions/bump" body: "*" }; }
 rpc SendCoins(SendCoinsRequest) returns (WalletSend) { option (google.api.http) = { post: "/v1/wallet/send" body: "*" }; }
 rpc BackupWallet(google.protobuf.Empty) returns (Backup) { option (google.api.http) = { post: "/v1/wallet/backup" body: "*" }; }
 rpc CreateWallet(CreateWalletRequest) returns (Settings) { option (google.api.http) = { post: "/v1/wallets" body: "*" }; }
 rpc PrepareFirstWallet(PrepareFirstWalletRequest) returns (FirstWallet) { option (google.api.http) = { post: "/v1/onboarding/wallet" body: "*" }; }
 rpc GetFirstWallet(google.protobuf.Empty) returns (FirstWallet) { option (google.api.http) = { post: "/v1/onboarding/recovery" body: "*" }; }
 rpc ConfirmFirstWallet(ConfirmFirstWalletRequest) returns (Settings) { option (google.api.http) = { post: "/v1/onboarding/confirm" body: "*" }; }
 rpc ExportFirstWallet(ExportFirstWalletRequest) returns (Backup) { option (google.api.http) = { post: "/v1/onboarding/backup" body: "*" }; }
 rpc FinishOnboarding(Settings) returns (Settings) { option (google.api.http) = { post: "/v1/onboarding/finish" body: "*" }; }
 rpc GetSettings(google.protobuf.Empty) returns (Settings) { option (google.api.http) = { get: "/v1/settings" }; }
 rpc UpdateSettings(Settings) returns (Settings) { option (google.api.http) = { put: "/v1/settings" body: "*" }; }
 rpc CheckNode(CheckNodeRequest) returns (CheckNodeResponse) { option (google.api.http) = { post: "/v1/settings/check-node" body: "*" }; }
}
message RefreshStatusRequest { string expected_network = 1; }
message ResolveWatchtowerRequest { string pubkey = 1; string expected_network = 2; }
message SetPausedRequest { bool paused = 1; string expected_network = 2; }
message CreateOfferRequest {
 int64 funding_fee = 8; int64 rate_sat_kvb = 9; int64 fee_timestamp = 10; int64 owner_fee_cap = 11;
 string tower_pubkey = 7; // Selected discovered provider; ignored when protection is off.
 string sell = 1; // btc or blake.
 string expected_network = 6; // Must match the active desktop network.
 int64 sell_amount = 2;
 int64 buy_amount = 3;
 int64 tower_bps = 4;
 int64 expires = 5; // Unix seconds; zero means 24 hours.
}
message CancelOfferRequest { string id = 1; string expected_network = 2; }
message TakeOfferRequest {
 int64 funding_fee = 6; int64 rate_sat_kvb = 7; int64 fee_timestamp = 8; int64 owner_fee_cap = 9;
 string maker = 1; string id = 2; string expected_network = 3;
 int64 tower_bps = 4; // This wallet's private protection; zero disables it.
 string tower_pubkey = 5; // Selected discovered provider, never sent to the maker.
}
message TakeOfferResponse { string id = 1; }
message MineRequest { string chain = 1; uint32 blocks = 2; string expected_network = 3; }
message FaucetRequest { string chain = 1; int64 amount = 2; string expected_network = 3; }
message FaucetResponse { string txid = 1; }
message Outpoint { string txid = 1; uint32 vout = 2; }
message WalletCoin {
 string chain = 1; string txid = 2; uint32 vout = 3; int64 amount = 4;
 string address = 5; int32 confirmations = 6; bool reserved = 7; repeated CoinHold holds = 8;
}
// A coin may have multiple owners; its amount is counted once in reserved_confirmed.
message CoinHold { string kind = 1; string id = 2; string reason = 3; bool cancellable = 4; }
message ChainBalance {
 int64 total_confirmed = 1; int64 unlocked_confirmed = 2; int64 reserved_confirmed = 3;
 int64 unconfirmed = 4; // Below the network's required confirmation depth.
 int64 htlc_locked = 5; // Observed unspent own contract principal, separate from deposit coins.
 bool htlc_available = 6; // False means contract observations are unavailable, never zero by inference.
}
message FundsPreflightRequest {
 string chain = 1; int64 amount = 2; int64 fee = 3; repeated Outpoint inputs = 4;
 string expected_network = 5; // Inputs omitted selects the actual automatic funding candidate set.
}
message FundsPreflight {
 string network = 1; string wallet = 2; repeated Outpoint inputs = 3;
 string state = 4; // proven, not_proven, checking, unavailable (not_applicable for Blake).
 string message = 5; bool sufficient = 6; int64 total = 7;
}
message SendCoinsRequest {
 int64 max_fee = 8; // Original replacement cap; zero disables fee increases.
 int64 rate_sat_kvb = 9; int64 fee_timestamp = 10;
 string id = 1; string chain = 2; string destination = 3; int64 amount = 4;
 int64 fee = 5; repeated Outpoint inputs = 6; string expected_network = 7;
}
message WalletSend {
 string state = 11; int64 max_fee = 12; repeated TransactionVariant variants = 13;
 string id = 1; string chain = 2; string txid = 3; string destination = 4;
 int64 amount = 5; int64 fee = 6; int64 change = 7; int32 confirmations = 8;
 string error = 9; bool submitted = 10;
}
message Recovery { string mnemonic = 1; string warning = 2; }
message Backup { string path = 1; }
message Offer {
 string id = 1; string maker = 2; string sell = 3;
 int64 sell_amount = 4; int64 buy_amount = 5; int64 tower_bps = 6;
 int64 expires = 7; string status = 8; string reservation = 9; string network = 10; Tower tower = 11;
}
message HTLC {
 string chain = 1; string hash = 2; string claim_key = 3; string refund_key = 4;
 // Legacy JSON alias; block height on regtest, median-time Unix timestamp on public networks.
 uint32 refund_locktime = 5 [json_name = "refund_height"];
 int64 amount = 6; string txid = 7; uint32 vout = 8;
}
message Swap {
 int64 claim_fee = 22; int64 refund_fee = 23; string claim_txid = 24; string refund_txid = 25;
 int64 owner_fee_cap = 18; int64 funding_fee = 19; repeated string claim_variants = 20; repeated string refund_variants = 21;
 string id = 1; string role = 2; string stage = 3; string error = 4;
 HTLC long = 5; HTLC short = 6; string long_spend = 7; string short_spend = 8;
 int32 long_confirmations = 9; int32 short_confirmations = 10; int64 tower_paid = 11;
 map<string,int64> tower_payments = 12;
 bool tower_ready = 13; bool tower_enabled = 14; bool secret_revealed = 15;
 uint32 takeover = 16; uint32 reveal_before = 17;
}
message Tower {
 string pubkey = 1; map<string,string> scripts = 2; int64 bps = 3;
 string npub = 4; string name = 5; string network = 6; int64 expires = 7;
 bool public = 9; // Opt-in public directory listing.
 string event = 8; // Signed provider announcement pinned to a protected offer.
}
message TowerJob {
 repeated string variants = 10;
 string id = 1; string swap_id = 2; string kind = 3; string chain = 4;
 uint32 eligible_height = 5; string broadcast = 6; int32 confirmations = 7;
 bool secret_observed = 8; string error = 9;
}
message Status {
 map<string,FeeLimits> fee_limits = 21;
 string name = 1; string mode = 2; string pubkey = 3;
 map<string,string> addresses = 4; map<string,int64> balances = 5;
 map<string,uint32> heights = 6; bool paused = 7;
 repeated Offer orders = 8; repeated Swap swaps = 9; repeated TowerJob tower_jobs = 10;
 int32 pending_messages = 11; string last_error = 12; Tower tower = 13;
 map<string,ChainBalance> funds = 20;
 repeated WalletCoin coins = 18; repeated WalletSend sends = 19;
 string network = 14;
 Tower own_watchtower = 15; repeated Tower watchtowers = 16; int64 funding_fee = 17;
}
message Node {
 string kind = 1; // electrum or rpc; all chain backends are external.
 string url = 2; // ssl://host:port or tcp://loopback:port for Electrum; HTTPS/loopback HTTP for RPC.
 string cookie = 3; // Absolute path to an RPC cookie file. The API never returns its contents.
 string certificate_sha256 = 4; // Optional explicit SHA256 of the Electrum server's DER certificate.
}
message Environment {
 map<string,string> explorers = 9; // Optional per-chain transaction URL templates containing {txid}; no default explorer is guessed.
 string network = 1; // regtest, testnet (Testnet4), or mainnet.
 map<string,Node> nodes = 2; // Exactly btc and blake.
 repeated string relays = 3;
 Tower tower = 4;
 reserved 5;
 bool public_watchtower = 7; // Off by default; private npub lookup remains available.
 repeated string favorite_watchtowers = 6; // Provider npubs, scoped to this network.
 int64 rescue_fee_bps = 8; // Own wallets' rescue rate: 1–1000 basis points; 0 retains the 50 bps default.
}
message WalletProfile { string id = 1; string name = 2; }
message CreateWalletRequest { string name = 1; uint64 revision = 2; }
message PrepareFirstWalletRequest {
 string name = 1; string mnemonic = 2;
 string backup_path = 3; string backup_password = 4; uint64 revision = 5;
}
message FirstWallet { Settings settings = 1; Recovery recovery = 2; repeated uint32 backup_word_positions = 3; }
message ConfirmFirstWalletRequest { uint64 revision = 1; repeated string words = 2; }
message ExportFirstWalletRequest { string path = 1; string password = 2; uint64 revision = 3; }
message Settings {
 string onboarding_stage = 5; // wallet, backup, connect; empty means completed. Older installs remain completed.
 repeated WalletProfile wallets = 4; // Stable IDs; display names may be edited. Create IDs with CreateWallet.
 string active_network = 1;
 repeated Environment environments = 2;
 uint64 revision = 3; // Compare-and-swap revision: stale updates are rejected.
}
message CheckNodeRequest { string network = 1; string chain = 2; Node node = 3; }
message CheckNodeResponse { uint32 height = 1; string trust = 2; }

// Rates are native chain satoshis per 1000 virtual bytes, rounded upward.
message FeeEstimate {
 uint32 requested_target = 8;
 string chain = 1; int64 rate_sat_kvb = 2; uint32 target = 3; int64 timestamp = 4;
 string source = 5; string state = 6; string error = 7;
}
message FeeLimits { int64 send = 1; int64 funding = 2; int64 owner = 3; int64 tower = 4; }
message FeeQuoteRequest {
 string kind = 1; string chain = 2; string destination = 3; int64 amount = 4;
 int64 fee = 5; uint32 target = 6; repeated Outpoint inputs = 7; string expected_network = 8;
}
message FeeQuote {
 FeeEstimate estimate = 1; FeeLimits limits = 2; int64 fee = 3; int64 amount = 4;
 int64 change = 5; int64 total = 6; int64 vsize = 7; repeated Outpoint inputs = 8; string error = 9;
}
message TransactionVariant { string txid = 1; int64 fee = 2; int32 confirmations = 3; bool submitted = 4; }
message BumpRequest { string id = 1; string kind = 2; int64 fee = 3; string expected_txid = 4; string expected_network = 5; }
message BumpResult { string txid = 1; int64 fee = 2; string state = 3; string error = 4; }

// Read-only review. Amounts describe the maker's signed offer/draft; the response
// orients economics to the selected wallet. Every fee is native to its chain.
message TradeQuoteRequest {
 string kind = 1; string expected_wallet = 2; string expected_network = 3;
 string maker = 4; string id = 5; string sell = 6;
 int64 sell_amount = 7; int64 buy_amount = 8; int64 expires = 9;
 int64 tower_bps = 10; string tower_pubkey = 11;
 int64 funding_fee = 12; int64 rate_sat_kvb = 13; int64 fee_timestamp = 14; int64 owner_fee_cap = 15;
}
message TradeFeePolicy { int64 funding_fee = 1; int64 rate_sat_kvb = 2; int64 fee_timestamp = 3; int64 owner_fee_cap = 4; }
message TradeTiming {
 string unit = 1; uint32 confirmations = 2; uint32 own_refund = 3; uint32 incoming_refund = 4;
 uint32 reveal_before = 5; uint32 tower_takeover = 6; uint32 refund_grace = 7; string first_revealer = 8;
}
message TradeOutcome {
 string kind = 1; string chain = 2; int64 principal = 3; int64 fee_min = 4; int64 fee_max = 5;
 int64 bounty = 6; int64 net_min = 7; int64 net_max = 8;
}
message TradeQuote {
 string token = 1; string revision = 2; string kind = 3; string wallet = 4; string wallet_key = 5;
 string network = 6; int64 created = 7; int64 expires = 8;
 string offer_event_id = 9; string offer_id = 10; string offer_maker = 11; int64 offer_expires = 12;
 string paid_chain = 13; int64 paid_principal = 14; int64 paid_total = 15;
 string received_chain = 16; int64 received_principal = 17;
 int64 rate_numerator = 18; int64 rate_denominator = 19; string rate_display = 20;
 TradeFeePolicy fees = 21; int64 funding_size = 22; Tower provider = 23;
 string provider_revision = 24; string tower_coverage = 25; TradeTiming timing = 26;
 repeated TradeOutcome outcomes = 27; FundsPreflight funds = 28; bool ready = 29; string error = 30;
}
// Keep this exact identity through an uncertain response. A persisted receipt
// returns the same accepted result after restart/expiry, never a second trade.
message ConfirmTradeRequest {
 string token = 1; string revision = 2; string request_id = 3; string expected_wallet = 4; string expected_network = 5;
}
message ConfirmTradeResult { string id = 1; string kind = 2; string state = 3; string error = 4; }

message ActivityVariant {
 string txid = 1;
 int64 amount = 2;
 int64 principal = 3;
 int64 fee = 4;
 bool fee_known = 5;
 string fee_payer = 6;
 int64 bounty = 7;
}

message ActivityRecord {
 int32 version = 1;
 string id = 2;
 string group_id = 3;
 string wallet = 4;
 string network = 5;
 string kind = 6;
 string chain = 7;
 string direction = 8;
 string classification = 9;
 bool movement = 10;
 int64 amount = 11;
 int64 principal = 12;
 int64 fee = 13;
 bool fee_known = 14;
 string fee_payer = 15;
 int64 bounty = 16;
 string counter_chain = 17;
 int64 counter_amount = 18;
 string order_id = 19;
 string swap_id = 20;
 string send_id = 21;
 repeated string related_ids = 22;
 string address = 23;
 repeated Outpoint outpoints = 24;
 string txid = 25;
 repeated string variants = 26;
 string local_status = 27;
 string status = 28;
 int32 confirmations = 29;
 int64 created_at = 30;
 string created_source = 31;
 int64 recorded_at = 32;
 int64 updated_at = 33;
 int64 block_time = 34;
 string block_hash = 35;
 string label = 36;
 string source = 37;
 uint64 generation = 38;
 int64 observed_at = 39;
 repeated ActivityVariant variant_amounts = 40;
 repeated ActivityObservation observations = 41;
 repeated ActivityOutcome history = 42;
}

message ActivityObservation {
 uint64 sequence = 1;
 string txid = 2;
 string status = 3;
 int32 confirmations = 4;
 uint32 height = 5;
 string block_hash = 6;
 int64 block_time = 7;
 int64 observed_at = 8;
 string source = 9;
 uint64 generation = 10;
 string error = 11;
}

message ActivityOutcome {
 string status = 1;
 string txid = 2;
 int64 amount = 3;
 int64 fee = 4;
 bool fee_known = 5;
 string block_hash = 6;
 int64 block_time = 7;
 int64 observed_at = 8;
 string source = 9;
 uint64 generation = 10;
}

message ActivityIndex {
 uint32 address = 1;
 string after = 2;
 string source = 3;
 uint64 generation = 4;
 int64 completed_pass = 5;
 string error = 6;
}

message ActivityQuery {
 string expected_wallet = 1;
 string expected_network = 2;
 string kind = 3;
 string status = 4;
 string chain = 5;
 int64 from = 6;
 int64 to = 7;
 string snapshot = 8;
 uint32 cursor = 9;
 uint32 limit = 10;
}

message ActivityPage {
 string snapshot = 1;
 int64 expires = 2;
 uint64 revision = 3;
 uint32 total = 4;
 uint32 next_cursor = 5;
 repeated ActivityRecord records = 6;
 map<string,ActivityIndex> index = 7;
 string error = 8;
}

message ActivityExport {
 string snapshot = 1;
 int64 expires = 2;
 uint32 next_cursor = 3;
 uint32 total = 4;
 string csv = 5;
}
